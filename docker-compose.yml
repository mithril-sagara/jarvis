services:
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-brain
    volumes:
      - ./ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull llama3.2:1b && wait"
    restart: always

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: jarvis-stt
    environment:
      - WHISPER_MODEL=tiny
      - WHISPER_LANGUAGE=ja
    restart: unless-stopped

  tts:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: jarvis-tts
    restart: unless-stopped

  jarvis-core:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        # 1. システムパッケージを全投入（pyaudioビルド用の gcc と python3-dev を追加）
        RUN apt-get update && apt-get install -y \
            alsa-utils \
            x11-xserver-utils \
            xscreensaver \
            portaudio19-dev \
            gcc \
            python3-dev \
            libatomic1 \
            wget \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /app
        
        # 2. ライブラリをインストール（pip自体も最新に）
        RUN pip install --no-cache-dir --upgrade pip
        RUN pip install --no-cache-dir requests influxdb-client ollama
        RUN pip install --no-cache-dir openwakeword pyaudio numpy
        
        # 3. ジャービスのモデルを自動取得
        RUN mkdir -p /app/models && \
            wget -O /app/models/jarvis.tflite https://github.com/fkie-it/openwakeword-models/raw/main/models/jarvis.tflite
        
        COPY . .
        CMD ["python", "main.py"]
    container_name: jarvis-core
    depends_on:
      - ollama
      - stt
      - tts
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - INFLUXDB_URL=${INFLUXDB_URL}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - OLLAMA_HOST=ollama:11434
      - STT_URL=http://stt:10300/transcribe
      - TTS_URL=http://tts:50021
      - SPEAKER_ID=13
      - OLLAMA_MODEL=llama3.2:1b
      - DISPLAY=:0
    restart: unless-stopped
